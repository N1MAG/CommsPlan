
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqinout"
version = "2.0.9"
description = "CommsPlan HF radio operations console"
readme = "README.md"
authors = [{ name = "Bill Daniel" }]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "PySide6==6.8.1.1",
  "PySide6-Essentials==6.8.1.1",
  "PySide6-Addons==6.8.1.1",
  "bleak>=1.0.0",
  "meshtastic>=2.7.11,<3",
  "meshcore>=2.3.14,<3",
  "psutil>=5.9.0",
  "requests>=2.31.0",
  "pytz>=2023.3",
  "tzdata>=2024.1",
  "keyring>=25.0",
  "reportlab>=4.0",
]

[project.scripts]
commsplan = "freqinout.main:main"
freqinout = "freqinout.main:main"

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["freqinout*"]

[tool.setuptools.package-data]
freqinout = ["gui/qml/*.qml", "resources/spotter_forms/*.txt"]
